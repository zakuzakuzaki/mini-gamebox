name: Run Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: barichello/godot-ci:4.6.1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Godot font runtime dependency
        run: apt-get update && apt-get install -y --no-install-recommends libfontconfig1

      - name: Import game resources
        run: godot --headless --path game --editor --import --quit

      - name: Test WASM loader
        run: node scripts/test-wasm-loader.mjs

      - name: Test Gomoku
        run: bash scripts/test-game.sh
